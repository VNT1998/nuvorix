[project]
name = "nuvorix"
version = "0.1.0"
description = "Nuvorix — AI/ML Production Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "joblib>=1.4.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
    "click>=8.1.7",
    "mlflow>=2.15.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "opentelemetry-sdk>=1.26.0",
    "fastembed>=0.9.0",
    "pgvector>=0.5.0",
    "opentelemetry-exporter-otlp-proto-http>=1.26.0",
    "alembic>=1.13.0",
]

[project.scripts]
nuvorix = "nuvorix_cli.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "backend/app",
    "packages/cli/nuvorix_cli",
    "packages/sdk-python/nuvorix",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "C4", "PT", "RUF"]
ignore = [
    "B008",    # FastAPI Depends in function arguments
    "BLE001",  # Broad exception catches
    "RUF012",  # Mutable class attributes
    "E501",    # Line length handled by formatter
    "SIM105",  # contextlib.suppress
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101", "S105", "S106", "PT018", "PT011", "PT012"]
"backend/app/core/config.py" = ["S105"]
"packages/cli/*" = ["S101"]
"packages/sdk-python/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
