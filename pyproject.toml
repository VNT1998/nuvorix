[project]
name = "nuvorix"
version = "0.1.0"
description = "Nuvorix — AI/ML Production Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "joblib>=1.4.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
    "click>=8.1.7",
]

[project.scripts]
nuvorix = "nuvorix_cli.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "apps/api/app",
    "packages/cli/nuvorix_cli",
    "packages/sdk-python/nuvorix",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",    # FastAPI Depends in function arguments
    "BLE001",  # Broad exception catches
    "RUF012",  # Mutable class attributes
]
