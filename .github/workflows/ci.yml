name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality-gate:
    name: Backend Quality Gate (Lint, Format, Mypy, Pytest & Contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (Frozen with Dev)
        run: uv sync --frozen --extra dev

      - name: Check Ruff Code Format
        run: uv run ruff format --check apps packages

      - name: Run Ruff Lint
        run: uv run ruff check apps packages

      - name: Run Mypy Type Checker
        run: uv run mypy apps/api/app packages/cli packages/sdk-python

      - name: Run Pytest Test Suite with Coverage
        run: uv run pytest --cov=apps.api.app -v

      - name: Verify OpenAPI Contract Sync
        run: |
          uv run python scripts/gen_openapi_schema.py
          git diff --exit-code docs/openapi.json

  frontend-quality-gate:
    name: Frontend Quality Gate (Lint, Typecheck, Test & Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies (Clean Install)
        working-directory: apps/web
        run: npm ci

      - name: ESLint Code Quality
        working-directory: apps/web
        run: npm run lint

      - name: TypeScript Typecheck (tsc -b)
        working-directory: apps/web
        run: npm run typecheck

      - name: Run Frontend Tests (Vitest)
        working-directory: apps/web
        run: npm test

      - name: Build Web Console (Vite)
        working-directory: apps/web
        run: npm run build

  infra-validation:
    name: Infrastructure Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform Init Dev
        run: terraform -chdir=infra/terraform/environments/dev init -backend=false

      - name: Terraform Validate Dev
        run: terraform -chdir=infra/terraform/environments/dev validate

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"

      - name: Helm Lint
        run: helm lint infra/helm/nuvorix
