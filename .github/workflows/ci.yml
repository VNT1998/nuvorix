name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test-and-lint:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (Frozen with Dev)
        run: uv sync --frozen --extra dev

      - name: Run Ruff Lint
        run: uv run ruff check apps packages

      - name: Run Pytest Test Suite
        run: uv run pytest -v

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies (Clean Install)
        working-directory: apps/web
        run: npm ci

      - name: Build Web Console (Vite)
        working-directory: apps/web
        run: npm run build

  infra-validation:
    name: Infrastructure Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform Init Dev
        run: terraform -chdir=infra/terraform/environments/dev init -backend=false

      - name: Terraform Validate Dev
        run: terraform -chdir=infra/terraform/environments/dev validate

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"

      - name: Helm Lint
        run: helm lint infra/helm/nuvorix
