{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "nuvorix.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nuvorix.fullname" . }}-config
  labels:
    {{- include "nuvorix.labels" . | nindent 4 }}
data:
  PROJECT_NAME: "Nuvorix Enterprise Platform"
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  MLFLOW_TRACKING_URI: {{ .Values.api.env.MLFLOW_TRACKING_URI | quote }}
  OTEL_ENDPOINT: {{ .Values.api.env.OTEL_ENDPOINT | quote }}
  PROMETHEUS_ENABLED: {{ .Values.api.env.PROMETHEUS_ENABLED | quote }}
{{- if not .Values.secrets.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nuvorix.fullname" . }}-secret
  labels:
    {{- include "nuvorix.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
